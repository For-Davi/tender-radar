# Integração contínua: valida todo push e todo PR para a branch principal (dev).
#
#   lint ─────────────┐
#   test-unit ────────┤
#   test-integration ─┼──> docker-build (backend + frontend)
#   dbt ──────────────┤
#   frontend ─────────┘
#
# Os cinco primeiros jobs rodam em paralelo; o build das imagens só roda se todos passarem.

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Um push novo na mesma branch cancela a execução anterior, que ficou obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Menor privilégio: o workflow só lê o repositório.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0                # este repo não publica tag só com o major (v10)
        with:
          enable-cache: true                     # cache dos pacotes baixados
          cache-dependency-glob: backend/uv.lock # o cache muda só quando o lock muda
      - run: uv sync --locked                    # --locked: falha se o uv.lock estiver desatualizado
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests

  test-unit:
    name: Testes unitários + cobertura
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0                # este repo não publica tag só com o major (v10)
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      # fail_under = 80 no pyproject: abaixo disso o job falha
      - run: uv run pytest -m unit --cov --cov-report=term-missing

  test-integration:
    name: Testes de integração (testcontainers)
    runs-on: ubuntu-24.04                        # o runner já tem Docker instalado
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0                # este repo não publica tag só com o major (v10)
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -m integration

  dbt:
    name: dbt build (camada gold) + contrato da API
    runs-on: ubuntu-24.04
    # Postgres de verdade como "service container" do GitHub Actions
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0                # este repo não publica tag só com o major (v10)
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            dbt/uv.lock
      # as migrações do backend criam a silver (vazia): é o que o dbt lê
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      # dbt build = seeds + modelos + testes de dados + unit tests (os de janela usam
      # entradas escritas à mão, então valem mesmo com a silver vazia)
      - run: uv sync --locked
        working-directory: dbt
      - run: uv run dbt build
        working-directory: dbt
      # contrato API x gold: as colunas que a API lê existem nas tabelas que o dbt gerou
      # (as definições em backend/src/radar/adapters/postgres/gold.py)
      - run: uv run pytest -m contract

  frontend:
    name: Frontend (formato, lint, tipos, testes, contrato OpenAPI)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"               # sem telemetria anônima do Next
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc     # a mesma versão do ambiente local (24)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci                              # exatamente o package-lock
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage                    # thresholds de 80% no vitest.config.mts
      # Contrato backend -> frontend: regenera o OpenAPI a partir da API e os tipos
      # TypeScript a partir dele. Se algo mudou, alguém alterou a API sem rodar
      # "make openapi": o frontend estaria compilando contra tipos velhos.
      - uses: astral-sh/setup-uv@v10.2.0                # este repo não publica tag só com o major (v10)
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
        working-directory: backend
      - run: uv run python scripts/exportar_openapi.py
        working-directory: backend
      - run: npm run openapi:types
      - run: git diff --exit-code -- openapi.json src/lib/api/schema.d.ts

  docker-build:
    name: Build das imagens Docker
    needs: [lint, test-unit, test-integration, dbt, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false                            # só valida que a imagem builda; publicar é na Etapa 10
          # reaproveita camadas entre execuções; um "scope" por imagem para não se sobrescreverem
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
