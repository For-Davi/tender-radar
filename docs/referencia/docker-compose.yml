# Radar de Licitações - stack completa
# Uso: cp .env.example .env && docker compose up -d --build

x-python-service: &python-service
  build:
    context: ./services
    dockerfile: Dockerfile
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    mongo: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    minio: { condition: service_healthy }

services:
  # ---------- Infraestrutura ----------
  postgres:
    image: pgvector/pgvector:pg16          # Postgres + extensão pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar}"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7                         # camada bronze: JSON bruto da API
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management        # UI em http://localhost:15672
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbit_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  minio:
    image: minio/minio:latest              # armazenamento S3-compatível para PDFs
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2   # tracking dos experimentos de ML
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow_data:/mlflow]

  # ---------- Aplicação ----------
  api:
    <<: *python-service
    command: uvicorn radar.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 5

  worker-ingestao:
    <<: *python-service
    command: python -m radar.workers.ingestao   # busca no PNCP e publica edital.novo

  worker-extracao:
    <<: *python-service
    command: python -m radar.workers.extracao   # consome a fila: PDF -> LLM -> Postgres
    deploy:
      replicas: 2                                # escala horizontal de consumidores

  dbt:
    build:
      context: ./dbt
    env_file: .env
    profiles: ["jobs"]                           # roda sob demanda: docker compose run dbt build
    depends_on:
      postgres: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pg_data:
  mongo_data:
  rabbit_data:
  minio_data:
  mlflow_data:
